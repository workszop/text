<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How the context window works · edulab</title>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="shared.css">
    <script src="shared.js"></script>
    <style>
        /* Page styles – tokens and chrome live in shared.css (no Tailwind on this page) */
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        h1, h2, h3, h4, p { margin: 0; }
        button { font: inherit; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* Section bands: white / stone, full width with fluid side margins like index.html */
        .band { padding: 22px var(--gutter) 40px; }
        .band + .band { border-top: 1px solid var(--line); }
        .band-stone { background: var(--paper-2); padding-top: 36px; padding-bottom: 56px; }
        .band-white { padding-top: 36px; padding-bottom: 70px; }

        .sec-head { display: flex; align-items: center; gap: 14px; margin: 0 0 14px; }
        .sec-head h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--h3); letter-spacing: -0.015em; color: var(--ink); }
        .sec-head::after { content: ''; flex: 1; height: 1px; background: var(--line-2); }
        .badge-lg { width: 46px; height: 46px; border-radius: var(--r-md); }
        .badge-lg .ic { width: 22px; height: 22px; }
        .sec-lead { font-family: var(--font-sans); font-size: 1.15rem; line-height: 1.6; color: var(--ink-2); margin-bottom: 20px; }

        /* Category fills (labelled in every legend) */
        .k-system  { background: var(--ink-3);     color: var(--paper); }
        .k-tools   { background: var(--ink);       color: var(--paper); }
        .k-user, .k-conv { background: var(--blue-soft);  color: var(--blue-ink); }
        .k-model   { background: var(--green-soft); color: var(--green-ink); }
        .k-file    { background: var(--yellow);     color: var(--yellow-ink); }
        .k-chunk   { background: var(--yellow) repeating-linear-gradient(135deg, transparent 0 6px,
                         color-mix(in srgb, var(--ink) 16%, transparent) 6px 8px);
                     color: var(--yellow-ink); }   /* striped: pieces of the document */
        .k-summary { background: var(--grape-soft); color: var(--grape-ink); }
        .k-reserve { background: var(--surface);    color: var(--ink-2); border: 1px dashed var(--line-strong); }
        .k-free    { background: var(--paper-2);    color: var(--ink-3); }

        /* ─── Budget bar ─── */
        .scale { display: flex; justify-content: space-between; gap: 12px; margin: 22px 0 8px;
            font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--ink); }
        .budget-bar { display: flex; height: 72px; border-radius: var(--r-sm); overflow: hidden;
            background: var(--paper-2); border: 1.5px solid var(--line-2); }
        .budget-bar.over { border-color: var(--red-600); }
        .budget-bar .seg { height: 100%; flex: none; transition: width 0.25s ease; }
        .budget-bar .seg + .seg { border-left: 1px solid var(--surface); }
        .budget-under { position: relative; height: 34px; margin-top: 8px; }
        .budget-pct { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap;
            font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--ink); transition: left 0.25s ease; }
        .budget-pct.over { color: var(--red-600); }
        .slider-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 10px; }
        .slider-row input { flex: 1 1 260px; }
        .slider-value { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); min-width: 220px; }
        .legend-count { font-family: var(--font-mono); font-size: 12px; color: var(--ink); }

        /* Range: --track rail, yellow thumb with an ink ring (>= 3:1 on white) */
        input[type=range] { -webkit-appearance: none; appearance: none; height: 28px; background: transparent; cursor: pointer; }
        input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: var(--r-pill); background: var(--track); }
        input[type=range]::-moz-range-track { height: 6px; border-radius: var(--r-pill); background: var(--track); }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px;
            border-radius: 50%; background: var(--yellow); border: 2px solid var(--ink); }
        input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--ink); }

        /* ─── Simulator ─── */
        .stack { display: flex; flex-direction: column; gap: 16px; }
        .ctrl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
        .ctrl-row + .ctrl-row { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line-2); }
        .ctrl-group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .ctrl-row .edu-btn { padding: 8px 14px; }
        .rail-narrow { --rail-w: 160px; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .opt-btn { border: none; background: transparent; padding: 6px 16px; border-radius: var(--r-pill);
            font-family: var(--font-sans); font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer;
            transition: background 0.15s, color 0.15s; }
        .opt-btn.active { background: var(--yellow); color: var(--yellow-ink); }
        .edu-btn .ic { width: 15px; height: 15px; }
        kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: var(--r-xs);
            background: var(--paper-3); color: var(--ink); }
        .edu-btn-primary kbd { background: color-mix(in srgb, var(--ink) 12%, transparent); }

        /* --sim-h is set by fitSimHeight() so controls + chat + window fit one screen */
        .sim-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: stretch; }
        .sim-grid > .edu-card { display: flex; flex-direction: column; }
        .sim-grid .card-body { flex: 1 1 auto; display: flex; flex-direction: column; }

        /* Transcript */
        .transcript { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; height: var(--sim-h, 520px); overflow-y: auto; padding-right: 4px; }
        .msg { max-width: 88%; padding: 10px 14px; border-radius: var(--r-md); font-size: 15px; line-height: 1.5; }
        .msg-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 4px;
            font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .04em; }
        .msg-user  { align-self: flex-end; background: var(--blue-soft); color: var(--blue-ink); }
        .msg-model { align-self: flex-start; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }
        .msg-file  { align-self: flex-end; background: var(--yellow); color: var(--yellow-ink); font-family: var(--font-mono); font-size: 13px; }
        .msg-chunk { align-self: flex-start; max-width: 70%; font-family: var(--font-mono); font-size: 12px; }
        .msg[data-state="out"], .msg[data-state="summary"], .msg[data-state="index"] {
            background: var(--paper-2); color: var(--ink-3); border: 1px dashed var(--line-strong); }
        .flag { padding: 1px 8px; border-radius: var(--r-pill); text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
        .flag-out { background: var(--ink-3); color: var(--paper); }
        .flag-summary { background: var(--grape-soft); color: var(--grape-ink); }
        .flag-in { background: var(--green-soft); color: var(--green-ink); }
        .flag-partial { background: var(--yellow); color: var(--yellow-ink); }
        .flag-missing { background: var(--red-soft); color: var(--red-ink); }
        .note { align-self: stretch; display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: var(--r-sm);
            font-family: var(--font-mono); font-size: 12px; line-height: 1.5; }
        .note-drop { background: var(--paper-3); color: var(--ink); }
        .note-summary { background: var(--grape-soft); color: var(--grape-ink); }
        .note-reject { background: var(--red-soft); color: var(--red-ink); }
        .note-scen { background: var(--paper-2); color: var(--ink-2); font-family: var(--font-sans); font-size: 14px; }
        .empty-hint { margin: auto; text-align: center; color: var(--ink-3); font-size: 15px; max-width: 34ch; }

        /* Window column: fixed height = capacity, block height = tokens */
        .meter { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px;
            font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
        .meter strong { font-size: 15px; color: var(--ink); font-weight: 600; }
        .window-row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 14px; align-items: start; }
        .window-box { display: flex; flex-direction: column; height: var(--sim-h, 460px); border-radius: var(--r-sm); overflow: hidden;
            background: var(--paper-2); border: 1.5px solid var(--line-2); }
        .window-box.over { border-color: var(--red-600); }
        .blk { flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; overflow: hidden; white-space: nowrap;
            font-family: var(--font-mono); font-size: 11px; font-weight: 500; border-bottom: 1px solid var(--surface);
            transition: height 0.3s ease; }
        .blk .n { margin-left: auto; opacity: .85; }
        .blk.k-reserve { border-bottom: none; }
        .blk.k-free { flex: 1 1 auto; justify-content: center; border-bottom: none; }
        .blk.fresh { animation: fadeIn 0.45s cubic-bezier(.32,.72,.32,1); }
        .index-box { margin-top: 14px; padding: 8px 10px; border-radius: var(--r-sm); border: 1px dashed var(--line-strong);
            font-family: var(--font-mono); font-size: 11px; line-height: 1.5; color: var(--ink-2); background: var(--surface); }
        .index-box[hidden] { display: none; }
        .legend-grid { display: grid; grid-template-columns: 1fr; gap: 5px; width: 100%; }   /* one row per category, count on the right */
        .legend-grid .legend-item { min-width: 0; }
        .legend-grid .swatch { flex: none; }
        .legend-grid .meta-label { min-width: 0; white-space: normal; }
        .legend-grid .legend-count { flex: none; margin-left: auto; white-space: nowrap; font-size: 11px; color: var(--ink-2); }

        /* Stat blocks: solid fills */
        .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .stat { border-radius: var(--r-lg); padding: 14px 18px; }
        .stat .v { display: block; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; }
        .stat .l { display: block; margin-top: 4px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }

        /* ─── Real apps: icon tiles ─── */
        .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
        .tile { display: flex; flex-direction: column; }
        .tile .card-body { flex: 1 1 auto; font-size: 15px; line-height: 1.6; color: var(--ink-2); }
        .tile .card-foot { flex-direction: column; align-items: flex-start; gap: 8px; }
        .tile .chip { font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em;
            padding: 3px 10px; border-radius: var(--r-pill); }
        .tile .src { font-size: 13px; line-height: 1.45; color: var(--ink-3); }
        .tile .src a { color: var(--blue-600); }
        .tile .src a:hover { color: var(--ink); }

        @media (max-width: 1400px) {
            .wide #sim.app-layout { grid-template-columns: 1fr; }
            #sim .app-guide { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 960px) {
            .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 768px) {
            .sim-grid { grid-template-columns: 1fr; }
            .transcript { height: 420px; }
            .window-box { height: 380px; }
            .window-row { grid-template-columns: 140px minmax(0, 1fr); }
            .stats { grid-template-columns: 1fr; }
            .scale { font-size: 12px; }
            .slider-value { min-width: 0; }
            .tiles { grid-template-columns: 1fr; }
            #sim .app-guide { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="edu wide">

<!-- edulab branded header -->
<header class="edu-header">
    <div class="edu-header-inner">
        <img class="edu-logo" alt="edulab" src="edulab-mark-ink.png">
        <span class="edu-wordmark">edulab</span>
        <nav class="edu-nav" aria-label="Pages">
            <a href="index.html" data-i18n="navGen">Generation</a>
            <a href="context.html" aria-current="page" data-i18n="navCtx">Context window</a>
        </nav>
        <div class="edu-seg" role="group" aria-label="Language">
            <button class="lang-btn" data-lang="pl" type="button">PL</button>
            <button class="lang-btn" data-lang="en" type="button">EN</button>
        </div>
    </div>
</header>

<main>
<!-- ─── Band 1: the budget ─── -->
<section class="band">
<div class="wrap">
    <header class="page-header">
        <h1 class="app-title" data-i18n="title">How the context window works</h1>
    </header>

    <div class="sec-head">
        <span class="badge badge-lg tone-ink"><i data-lucide="gauge" class="ic"></i></span>
        <h2 data-i18n="budgetTitle">Context is a budget</h2>
    </div>
    <p class="sec-lead" data-i18n="budgetText"></p>

    <div id="budget" class="edu-card" data-used="0" data-used-pct="0" data-overflow="false">
        <div class="card-body">
            <div class="scale"><span>0</span><span data-i18n="scaleMax"></span></div>
            <div id="budgetBar" class="budget-bar" role="img">
                <div class="seg k-system" data-seg="system"></div>
                <div class="seg k-tools"  data-seg="tools"></div>
                <div class="seg k-conv"   data-seg="conv"></div>
                <div class="seg k-file"   data-seg="files"></div>
            </div>
            <div class="budget-under"><span id="budgetPct" class="budget-pct"></span></div>
            <div class="slider-row">
                <label class="field-label" for="sessionSlider" data-i18n="sessionLabel">Session length</label>
                <input id="sessionSlider" type="range" min="0" max="100" value="56">
                <span id="sessionValue" class="slider-value"></span>
            </div>
        </div>
        <div class="card-foot" aria-label="Legend">
            <span class="legend-item"><span class="swatch k-system"></span><span class="meta-label" data-i18n="segSystem"></span><span class="legend-count" data-count="system"></span></span>
            <span class="legend-item"><span class="swatch k-tools"></span><span class="meta-label" data-i18n="segTools"></span><span class="legend-count" data-count="tools"></span></span>
            <span class="legend-item"><span class="swatch k-conv"></span><span class="meta-label" data-i18n="segConv"></span><span class="legend-count" data-count="conv"></span></span>
            <span class="legend-item"><span class="swatch k-file"></span><span class="meta-label" data-i18n="segFiles"></span><span class="legend-count" data-count="files"></span></span>
            <span class="legend-item"><span class="swatch k-free"></span><span class="meta-label" data-i18n="segFree"></span><span class="legend-count" data-count="free"></span></span>
        </div>
    </div>
</div>
</section>

<!-- ─── Band 2: the simulation ─── -->
<section class="band band-stone">
<div class="wrap">
    <div class="sec-head">
        <span class="badge badge-lg tone-ink"><i data-lucide="file-text" class="ic"></i></span>
        <h2 data-i18n="simTitle">A conversation about a document</h2>
    </div>
    <p class="sec-lead" data-i18n="simLead"></p>

    <div id="sim" class="app-layout" data-scenario="policy" data-doc-mode="full" data-doc-state="none" data-phase="ready"
         data-turn="0" data-used="0" data-capacity="256000" data-strategy="drop" data-out="0" data-summarized="0">
    <div class="app-column stack">

        <!-- Controls -->
        <div id="controlsCard" class="edu-card rail rail-narrow">
            <div class="card-head">
                <span class="badge tone-ink"><i data-lucide="sliders-horizontal" class="ic"></i></span>
                <h3 class="card-title" data-i18n="controlsTitle">Conversation</h3>
                <span class="head-meta">
                    <span class="meta-label"><span data-i18n="turnLabel">Turn</span> <span id="turnCount">0</span></span>
                    <span id="phaseChip" class="sr-only" role="status" aria-live="polite"></span>
                </span>
                <button id="resetBtn" class="edu-btn edu-btn-ghost btn-sm" type="button" aria-keyshortcuts="R">
                    <i data-lucide="rotate-ccw" class="ic"></i>
                    <span data-i18n="reset">Reset</span> <kbd>R</kbd>
                </button>
            </div>
            <div class="card-body">
                <div class="ctrl-row">
                    <span class="ctrl-group">
                        <span id="scenLabel" class="field-label" data-i18n="scenLabel">Scenario</span>
                        <span class="edu-seg" style="margin-left:0" role="group" aria-labelledby="scenLabel">
                            <button class="opt-btn" data-scenario="policy" type="button" data-i18n="scenPolicy"></button>
                            <button class="opt-btn" data-scenario="report" type="button" data-i18n="scenReport"></button>
                        </span>
                    </span>
                    <span class="ctrl-group">
                        <span id="docModeLabel" class="field-label" data-i18n="docModeLabel">Document</span>
                        <span class="edu-seg" style="margin-left:0" role="group" aria-labelledby="docModeLabel">
                            <button class="opt-btn" data-doc-mode="full" type="button" data-i18n="modeFull"></button>
                            <button class="opt-btn" data-doc-mode="rag" type="button" data-i18n="modeRag"></button>
                        </span>
                    </span>
                    <span class="ctrl-group">
                        <span id="strategyLabel" class="field-label" data-i18n="strategyLabel">When it's full</span>
                        <span class="edu-seg" style="margin-left:0" role="group" aria-labelledby="strategyLabel">
                            <button class="opt-btn" data-strategy="drop" type="button" data-i18n="stDrop"></button>
                            <button class="opt-btn" data-strategy="summary" type="button" data-i18n="stSum"></button>
                            <button class="opt-btn" data-strategy="stop" type="button" data-i18n="stStop"></button>
                        </span>
                    </span>
                </div>
                <div class="ctrl-row">
                    <button id="nextBtn" class="edu-btn edu-btn-primary" type="button" aria-keyshortcuts="N">
                        <i data-lucide="play" class="ic"></i>
                        <span data-i18n="nextTurn">Next turn</span> <kbd>N</kbd>
                    </button>
                    <span class="ctrl-group">
                        <span class="field-label" data-i18n="askLabel">Ask</span>
                        <button class="edu-btn edu-btn-ghost probe-btn" data-probe="detail" type="button" aria-keyshortcuts="1">
                            <span data-i18n="askDetail"></span> <kbd>1</kbd>
                        </button>
                        <button class="edu-btn edu-btn-ghost probe-btn" data-probe="global" type="button" aria-keyshortcuts="2">
                            <span data-i18n="askGlobal"></span> <kbd>2</kbd>
                        </button>
                        <button class="edu-btn edu-btn-ghost probe-btn" data-probe="memory" type="button" aria-keyshortcuts="3">
                            <span data-i18n="askMemory"></span> <kbd>3</kbd>
                        </button>
                    </span>
                </div>
            </div>
        </div>

        <div id="simGrid" class="sim-grid">
            <!-- What the user sees -->
            <div class="edu-card">
                <div class="card-head">
                    <span class="badge tone-blue"><i data-lucide="message-square" class="ic"></i></span>
                    <h3 class="card-title" data-i18n="chatTitle">Chat</h3>
                    <span class="head-meta"><span class="meta-label" data-i18n="chatMeta"></span></span>
                </div>
                <div class="card-body">
                    <div id="transcript" class="transcript" tabindex="0" aria-label="Chat"></div>
                </div>
            </div>

            <!-- What the model sees: the bar at true scale, the legend with counts beside it -->
            <div class="edu-card">
                <div class="card-head">
                    <span class="badge tone-green"><i data-lucide="layers" class="ic"></i></span>
                    <h3 class="card-title" data-i18n="windowTitle">Context window</h3>
                    <span class="head-meta"><span class="meta-label" data-i18n="windowMeta"></span></span>
                </div>
                <div class="card-body">
                    <div class="meter"><span><strong id="meterUsed"></strong> / <span id="meterCap"></span></span></div>
                    <div class="window-row">
                        <div id="windowBox" class="window-box" role="img"></div>
                        <div class="window-side">
                            <div class="legend-grid" aria-label="Legend">
                                <span class="legend-item"><span class="swatch k-system"></span><span class="meta-label" data-i18n="segSystem"></span><span class="legend-count" data-wcount="system"></span></span>
                                <span class="legend-item"><span class="swatch k-tools"></span><span class="meta-label" data-i18n="segTools"></span><span class="legend-count" data-wcount="tools"></span></span>
                                <span class="legend-item"><span class="swatch k-file"></span><span class="meta-label" data-i18n="segDoc"></span><span class="legend-count" data-wcount="doc"></span></span>
                                <span class="legend-item"><span class="swatch k-chunk"></span><span class="meta-label" data-i18n="segChunks"></span><span class="legend-count" data-wcount="chunks"></span></span>
                                <span class="legend-item"><span class="swatch k-user"></span><span class="meta-label" data-i18n="youLabel"></span><span class="legend-count" data-wcount="user"></span></span>
                                <span class="legend-item"><span class="swatch k-model"></span><span class="meta-label" data-i18n="modelLabel"></span><span class="legend-count" data-wcount="model"></span></span>
                                <span class="legend-item"><span class="swatch k-summary"></span><span class="meta-label" data-i18n="blkSummary"></span><span class="legend-count" data-wcount="summary"></span></span>
                                <span class="legend-item"><span class="swatch k-reserve"></span><span class="meta-label" data-i18n="segReserve"></span><span class="legend-count" data-wcount="reserve"></span></span>
                                <span class="legend-item"><span class="swatch k-free"></span><span class="meta-label" data-i18n="segFree"></span><span class="legend-count" data-wcount="free"></span></span>
                            </div>
                            <div id="indexBox" class="index-box" hidden></div>
                        </div>
                    </div>
                </div>
            </div>

        const docInWindow = step.withDoc && sim.docMode === 'full';
        const search = sim.docMode === 'rag' && (step.withDoc || sim.turn > 0);
        const incoming = step.ut + (docInWindow ? doc.tokens : 0) + (search ? RAG_TOKENS : 0);
        const room = makeRoom(incoming);
        if (!room.ok) { setPhase('rejected'); return render(); }
        const n = sim.turn + 1;
        addItem({ kind: 'user', key: 'u' + n, tokens: step.ut, facts: step.facts });
        if (step.withDoc) addItem({ kind: 'file', tokens: doc.tokens, facts: ['doc'], state: docInWindow ? 'in' : 'index' });
        callModel({ key: 'a' + n, tokens: step.rt + step.think, visible: step.rt }, search);
        sim.turn++;
        afterCall(room);
        render();
    }

    // Where the answer to a test question can come from, given the window now
    function probeSource(which) {
        const doc = docItem();
        const has = f => sim.summary && sim.summary.facts.has(f);
        if (which === 'memory') {
            const u = firstUser();
            if (u && u.state === 'in') return { source: 'item', sourceId: u.id };
            return { source: has('who') ? 'summary' : 'missing' };
        }
        if (doc && doc.state === 'in') return { source: 'item', sourceId: doc.id, fromDoc: true };
        if (doc && doc.state === 'index') return { source: which === 'detail' ? 'chunk' : 'partial' };
        return { source: has('doc') ? 'summary' : 'missing' };
    }

    // A test question: the answer depends only on what is still in the window
    function ask(which) {
        if (!docItem()) return;                       // nothing to ask about before turn 1
        const p = PROBES[which];
        const search = p.search && sim.docMode === 'rag';
        const room = makeRoom(p.qt + (search ? RAG_TOKENS : 0));
        if (!room.ok) { setPhase('rejected'); return render(); }
        addItem({ kind: 'user', key: which + 'Q', tokens: p.qt });
        const src = probeSource(which);
        callModel({ key: `${which}_${src.source === 'item' ? 'item' : src.source}`, tokens: p.at + p.think, visible: p.at, probe: which, ...src }, search);
        afterCall(room);
        render();
    }

    function setStrategy(st) {
        sim.strategy = st;
        if (sim.phase === 'rejected') setPhase(sim.turn ? 'fits' : 'ready');
        render();
    }

    // Changing the scenario or how the document is loaded starts the chat over
    function setScenario(key) { sim.scenario = key; resetSim(); }
    function setDocMode(mode) { sim.docMode = mode; resetSim(); }

    function setPhase(p) { sim.phase = p; }

    function resetSim() {
        Object.assign(sim, { items: [], nextId: 1, turn: 0, summary: null, phase: 'ready',
                             lastRead: 0, totalRead: 0, freshIds: new Set() });
        render();
    }

    // ─── Render: budget ───────────────────────────────────────────────────────
    function renderBudget() {
        const b = budgetAt(+sessionSlider.value);
        const used = b.system + b.tools + b.conv + b.files;
        const pct = used / BUDGET_CAP * 100;
        const over = used > BUDGET_CAP;

        let left = 0;      // segments clip at the window's edge
        budgetBar.querySelectorAll('.seg').forEach(seg => {
            const w = Math.max(0, Math.min(b[seg.dataset.seg] / BUDGET_CAP * 100, 100 - left));
            seg.style.width = w + '%';
            left += w;
        });
        budgetBar.classList.toggle('over', over);

        budgetPct.textContent = over
            ? fill(t('overBy'), { p: Math.round(pct), n: fmtK(used - BUDGET_CAP) })
            : fill(t('usedPct'), { p: Math.round(pct) });
        budgetPct.classList.toggle('over', over);
        budgetPct.style.left = Math.min(Math.max(Math.min(pct, 100) / 2, 9), 85) + '%';
        budgetBar.setAttribute('aria-label', budgetPct.textContent);

        sessionValue.textContent = fill(t('sessionValue'), { m: b.nMsgs, f: b.nFiles });
        const counts = { ...b, free: Math.max(0, BUDGET_CAP - used) };
        budgetCard.querySelectorAll('[data-count]').forEach(n => { n.textContent = fmtK(counts[n.dataset.count]); });

        budgetCard.dataset.used = used;
        budgetCard.dataset.usedPct = Math.round(pct);
        budgetCard.dataset.overflow = over;
    }

    // ─── Render: simulation ───────────────────────────────────────────────────
    function itemLabel(it) {
        return { user: t('youLabel'), file: t('fileLabel'), chunk: t('chunkLabel') }[it.kind] || t('modelLabel');
    }

    function sourceFlag(it) {
        const guessy = it.probe !== 'memory';
        const map = {
            item:    ['flag-in',      fill(t(it.fromDoc ? 'srcDoc' : 'srcItem'), { id: it.sourceId })],
            chunk:   ['flag-in',      t('srcChunk')],
            partial: ['flag-partial', t('srcPartial')],
            summary: ['flag-summary', t('srcSummary')],
            missing: ['flag-missing', t(guessy ? 'srcGuess' : 'srcMissing')],
        };
        const [cls, txt] = map[it.source];
        return el('span', 'flag ' + cls, txt);
    }

    function messageText(it) {
        if (it.kind === 'file')  return `${sc('file')} · ${scenario().doc.pages} ${t('pages')}`;
        if (it.kind === 'chunk') return t('chunkText');
        return sc(it.key);
    }

    function renderMessage(it) {
        const box = el('div', `msg msg-${it.kind}`);
        if (it.kind === 'chunk') box.classList.add('k-chunk');
        box.dataset.state = it.state;
        box.dataset.id = it.id;
        const meta = el('div', 'msg-meta');
        meta.append(el('span', null, `#${it.id} ${itemLabel(it)} · ${fmt(it.visible ?? it.tokens)} ${t('tok')}`));   // visible text only
        const stateFlag = { out: ['flag-out', 'flagOut'], summary: ['flag-summary', 'flagSummary'], index: ['flag-out', 'flagIndex'] }[it.state];
        if (stateFlag) meta.append(el('span', 'flag ' + stateFlag[0], t(stateFlag[1])));
        if (it.source) meta.append(sourceFlag(it));
        box.append(meta, el('div', null, messageText(it)));
        return box;
    }

    function renderNote(it) {
        const kind = { noteDrop: 'drop', noteDropDoc: 'drop', noteSum: 'summary', noteReject: 'reject' }[it.key];
        const box = el('div', 'note note-' + kind);
        const n = it.vars && it.vars.n != null ? fmt(it.vars.n) : '';
        box.append(el('span', null, fill(t(it.key), { ids: idList(it.ids || []), cap: fmt(CAPACITY), n })));
        if (kind === 'summary') box.append(el('span', null, summaryText()));
        return box;
    }

    function summaryText() {
        if (!sim.summary) return '';
        const parts = ['who', 'doc'].filter(f => sim.summary.facts.has(f))
            .map(f => sc('fact' + f[0].toUpperCase() + f.slice(1)));
        return `${t('summaryLead')} ${parts.join('; ')}.`;
    }

    function renderTranscript() {
        transcript.innerHTML = '';
        transcript.append(el('div', 'note note-scen', sc('desc')));    // what this scenario is about
        if (!sim.items.length) { transcript.append(el('p', 'empty-hint', t('chatEmpty'))); return; }
        sim.items.forEach(it => {
            const node = it.kind === 'note' ? renderNote(it) : renderMessage(it);
            if (sim.freshIds.has(it)) node.classList.add('fade-in');
            transcript.append(node);
        });
        transcript.scrollTop = transcript.scrollHeight;
    }

    function block(cls, label, tokens, px, title, fresh) {
        const b = el('div', 'blk ' + cls);
        b.style.height = Math.max(MIN_BLOCK_PX, px) + 'px';
        b.title = title || `${label} · ${fmt(tokens)} ${t('tok')}`;
        if (px >= LABEL_MIN_PX) { b.append(el('span', null, label), el('span', 'n', fmtK(tokens))); }
        if (fresh) b.classList.add('fresh');
        return b;
    }

    function renderWindow() {
        const h = windowBox.clientHeight || 460;
        const px = tok => tok / CAPACITY * h;
        const counts = { system: SYSTEM_TOKENS, tools: TOOLS_TOKENS, doc: 0, chunks: 0, user: 0, model: 0,
                         summary: sim.summary ? sim.summary.tokens : 0 };
        windowBox.innerHTML = '';
        windowBox.append(block('k-system', t('blkSystem'), SYSTEM_TOKENS, px(SYSTEM_TOKENS)));
        windowBox.append(block('k-tools', t('blkTools'), TOOLS_TOKENS, px(TOOLS_TOKENS)));
        if (sim.summary) windowBox.append(block('k-summary', t('blkSummary'), sim.summary.tokens, px(sim.summary.tokens), summaryText()));
        inWindow().forEach(it => {
            const cls = { user: 'k-user', model: 'k-model', file: 'k-file', chunk: 'k-chunk' }[it.kind];
            counts[{ file: 'doc', chunk: 'chunks' }[it.kind] || it.kind] += it.tokens;
            const label = it.kind === 'file' ? `#${it.id} ${t('segDoc')}` : `#${it.id} ${itemLabel(it)}`;
            windowBox.append(block(cls, label, it.tokens, px(it.tokens),
                `${label} · ${fmt(it.tokens)} ${t('tok')}`, sim.freshIds.has(it)));
        });
        const used = usedTokens();
        const reserve = Math.max(0, Math.min(RESERVE_TOKENS, CAPACITY - used));
        if (reserve > 0) windowBox.append(block('k-reserve', t('blkReserve'), reserve, px(reserve)));
        const free = Math.max(0, CAPACITY - used - reserve);
        windowBox.append(el('div', 'blk k-free', px(free) >= LABEL_MIN_PX ? `${t('blkFree')} · ${fmtK(free)}` : ''));
        Object.assign(counts, { reserve, free });

        windowBox.classList.toggle('over', sim.phase === 'rejected');
        meterUsed.textContent = fmt(used);
        meterCap.textContent = `${fmt(CAPACITY)} ${t('tok')} · ${Math.round(used / CAPACITY * 100)}%`;
        windowBox.setAttribute('aria-label', `${t('windowMeta')}: ${fmt(used)} / ${fmt(CAPACITY)} ${t('tok')}`);
        document.querySelectorAll('[data-wcount]').forEach(n => { n.textContent = fmtK(counts[n.dataset.wcount]); });

        const doc = docItem();
        indexBox.hidden = !(doc && doc.state === 'index');
        if (!indexBox.hidden) indexBox.textContent = fill(t('indexText'), { file: sc('file'), n: fmtK(doc.tokens) });
    }

    // Size the chat and the window bar so the controls, chat and window fit one
    // screen (desktop only; phones stack and scroll). The header hides while
    // scrolling down to the simulator, so it does not count against the height.
    function fitSimHeight() {
        if (window.matchMedia('(max-width: 768px)').matches) { simRoot.style.removeProperty('--sim-h'); return; }
        const span  = simGrid.getBoundingClientRect().bottom - controlsCard.getBoundingClientRect().top;
        const fixed = span - windowBox.offsetHeight;          // everything around the stretchy bar
        const avail = window.innerHeight - FIT_MARGIN * 2;
        const h = Math.round(Math.max(SIM_MIN_H, Math.min(SIM_MAX_H, avail - fixed)));
        simRoot.style.setProperty('--sim-h', h + 'px');
        simRoot.dataset.fitsViewport = fixed + h <= avail;
    }

    function render() {
        fitSimHeight();
        renderTranscript();
        renderWindow();

        phaseChip.textContent = t(PHASES[sim.phase]);
        turnCount.textContent = `${sim.turn}/${scenario().turns.length}`;
        nextBtn.disabled = sim.turn >= scenario().turns.length;
        document.querySelectorAll('.probe-btn').forEach(b => {
            b.disabled = !docItem();
            b.title = sc(b.dataset.probe + 'Q');
        });
        [['scenario', sim.scenario], ['docMode', sim.docMode], ['strategy', sim.strategy]].forEach(([attr, val]) => {
            document.querySelectorAll(`.opt-btn[data-${attr.replace(/[A-Z]/, c => '-' + c.toLowerCase())}]`).forEach(b => {
                const on = b.dataset[attr] === val;
                b.classList.toggle('active', on);
                b.setAttribute('aria-pressed', on);
            });
        });

        const outCount = sim.items.filter(it => it.kind !== 'note' && (it.state === 'out' || it.state === 'summary')).length;
        statRead.textContent  = fmtK(sim.lastRead);
        statTotal.textContent = fmtK(sim.totalRead);
        statOut.textContent   = fmt(outCount);

        // DOM contract for agents / tests
        const doc = docItem();
        const lastAnswer = sim.items.filter(it => it.source).pop() || {};
        Object.assign(simRoot.dataset, {
            scenario: sim.scenario, docMode: sim.docMode, docState: doc ? doc.state : 'none',
            phase: sim.phase, turn: sim.turn, used: usedTokens(), capacity: CAPACITY, strategy: sim.strategy,
            out: sim.items.filter(it => it.state === 'out').length,
            summarized: sim.items.filter(it => it.state === 'summary').length,
            summaryTokens: sim.summary ? sim.summary.tokens : 0,
            lastRead: sim.lastRead, totalRead: sim.totalRead,
            lastSource: lastAnswer.source || '', lastProbe: lastAnswer.probe || '',
            reasoning: inWindow().reduce((a, it) => a + (it.visible != null ? it.tokens - it.visible : 0), 0),
        });
        sim.freshIds = new Set();
    }

    function applyLanguage() {
        document.documentElement.lang = lang;
        document.title = t('docTitle');
        document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
        document.querySelectorAll('.lang-btn').forEach(btn => {
            const on = btn.dataset.lang === lang;
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-pressed', on);
        });
        renderBudget();
        render();
    }

    function setLanguage(l) {
        lang = T[l] ? l : 'en';
        saveLanguage(lang);
        applyLanguage();
    }

    // ─── Event listeners ──────────────────────────────────────────────────────
    sessionSlider.addEventListener('input', renderBudget);
    nextBtn.addEventListener('click', nextTurn);
    resetBtn.addEventListener('click', resetSim);
    document.querySelectorAll('.probe-btn').forEach(b => b.addEventListener('click', () => ask(b.dataset.probe)));
    document.querySelectorAll('.opt-btn[data-scenario]').forEach(b => b.addEventListener('click', () => setScenario(b.dataset.scenario)));
    document.querySelectorAll('.opt-btn[data-doc-mode]').forEach(b => b.addEventListener('click', () => setDocMode(b.dataset.docMode)));
    document.querySelectorAll('.opt-btn[data-strategy]').forEach(b => b.addEventListener('click', () => setStrategy(b.dataset.strategy)));
    document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLanguage(b.dataset.lang)));
    document.addEventListener('keydown', e => {
        if (e.ctrlKey || e.metaKey || e.altKey || (e.target instanceof Element && e.target.matches('input, textarea'))) return;
        const k = e.key.toLowerCase();
        if (k === 'n' && !nextBtn.disabled) nextTurn();
        else if (k === '1') ask('detail');
        else if (k === '2') ask('global');
        else if (k === '3') ask('memory');
        else if (k === 'r') resetSim();
        else return;
        e.preventDefault();
    });
    window.addEventListener('resize', () => { fitSimHeight(); renderWindow(); });

    // ─── Init ─────────────────────────────────────────────────────────────────
    window.onload = () => {
        lang = initialLanguage(T);
        autoHideHeader(pageHeader);
        applyLanguage();
        if (window.lucide) lucide.createIcons();
    };
</script>

</body>
</html>
