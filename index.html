<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Text Generation Simulation · edulab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ── edulab palette remap ────────────────────────────────────────────
        // Tailwind utility classes keep their names but resolve to edulab tokens.
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Outfit"', '"IBM Plex Sans"', 'system-ui', 'sans-serif'],
                        sans:    ['"IBM Plex Sans"', 'system-ui', '-apple-system', 'sans-serif'],
                        mono:    ['"Roboto Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
                    },
                    colors: {
                        slate:  { 50:'#FFFFFF', 100:'#F5F3F0', 200:'#E0DBD3', 300:'#C9C2B7',
                                  400:'#625B53', 500:'#44403C', 600:'#44403C', 700:'#1C1917', 800:'#1C1917', 900:'#1C1917' },
                        stone:  { 50:'#FFFFFF', 100:'#F5F3F0', 200:'#EAE6E0', 300:'#C9C2B7', 400:'#857C69' },  // bands / wells / lines / control border
                        yellow: { 50:'#FFD500', 500:'#FFD500', 600:'#FFD500', 700:'#F0C800', 800:'#D9B400' },
                        blue:   { 50:'#1E8FC2', 500:'#177AA8', 600:'#177AA8', 700:'#146A92', 800:'#105A7C' },
                        green:  { 50:'#00A651', 500:'#078342', 600:'#078342', 700:'#06733A', 800:'#055F30' },
                        red:    { 50:'#E5322D', 500:'#C92823', 600:'#C92823', 700:'#B3261E', 800:'#9C2019' },
                        violet: { 500:'#7A5AC2', 600:'#6A4BAF' },
                    },
                },
            },
        };
    </script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="shared.css">
    <script src="shared.js"></script>
    <style>
        /* Page styles – tokens and chrome live in shared.css */
        /* Subword token chips ---------------------------------------------- */
        .token {
            display: inline-flex; align-items: center;
            padding: 3px 10px; margin: 2px 3px;
            border-radius: var(--r-pill);
            font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500;
            cursor: default; white-space: pre; letter-spacing: 0.01em;
        }
        .prompt-token    { background: var(--blue-soft);  color: var(--blue-ink); }
        .context-token   { background: var(--green-soft); color: var(--green-ink); }
        .eos-token       { background: var(--red-soft);   color: var(--red-ink); font-style: italic; }
        .eos-token.swatch { font-style: normal; }
        /* Idle preview: the prompt's words before tokenisation, and the slot the next token lands in */
        .ghost-token     { background: var(--surface); color: var(--ink-3); border: 1px dashed var(--line-strong); }
        .next-slot       { background: var(--paper-2); color: var(--ink-3); border: 1px dashed var(--line-strong); min-width: 34px; justify-content: center; }
        .candidate-token { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }

        /* Wide workbench: fluid side margins, labels in a left rail on each card */
        .wide-main { padding: 22px var(--gutter) 48px; }
        .rail-offset { margin-left: var(--rail-w, 230px); }
        #nextTokenButton { width: calc(100% - var(--rail-w, 230px)); }

        /* Probability rows: token | bar | %, unselected = sand well, selected = solid blue block */
        .prob-row { display: grid; grid-template-columns: minmax(110px, 200px) minmax(0, 1fr) 56px; align-items: center; gap: 14px;
            border-radius: var(--r-md); background: var(--paper-2); transition: background 0.15s; }
        .prob-row .pct { text-align: right; }
        .prob-row .pct { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--ink-2); }
        .prob-row.selected { background: var(--blue-soft); color: var(--blue-ink); }
        .prob-row.selected .pct { color: var(--blue-ink); }
        .prob-row.selected .candidate-token { border-color: transparent; }
        .prob-row.selected .eos-token { background: var(--surface); color: var(--red-600); }

        .prob-bar-track { height: 6px; border-radius: var(--r-pill); background: var(--track); overflow: hidden; }
        .prob-row.selected .prob-bar-track { background: color-mix(in srgb, var(--paper) 28%, transparent); }
        .prob-bar-fill  { height: 100%; border-radius: var(--r-pill); transition: width 0.35s ease; }

        /* Skeleton rows: the shape of a distribution before there is one */
        .prob-row.skeleton .pct { color: var(--ink-3); }
        .prob-row.skeleton .prob-bar-track { background: var(--surface); }
        .prob-row.skeleton .prob-bar-fill { background: var(--line-2); }
        .ghost-chip { display: inline-block; height: 24px; margin: 2px 3px; border-radius: var(--r-pill);
            background: var(--surface); border: 1px dashed var(--line-2); }
        .ghost-line { height: 10px; margin-top: 10px; border-radius: var(--r-pill); background: var(--paper-3); }

        /* Temperature toggle — same idiom as the language switch */
        .temp-btn { border: none; background: transparent; padding: 6px 18px; border-radius: var(--r-pill);
            font-family: var(--font-sans); font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer;
            transition: background 0.15s, color 0.15s; }
        .temp-btn.active { background: var(--yellow); color: var(--yellow-ink); }

        @media (max-width: 768px) {
            .rail-offset { margin-left: 0; }
            #nextTokenButton { width: 100%; }
            .prob-row { grid-template-columns: minmax(0, 1fr) 48px; gap: 6px 10px; }
            .prob-row .prob-bar-track { grid-column: 1 / -1; grid-row: 2; }
        }
    </style>
</head>
<body class="edu wide min-h-screen">

<!-- edulab branded header -->
<header class="edu-header">
    <div class="edu-header-inner">
        <img class="edu-logo" alt="edulab" src="edulab-mark-ink.png">
        <span class="edu-wordmark">edulab</span>
        <nav class="edu-nav" aria-label="Pages">
            <a href="index.html" aria-current="page" data-i18n="navGen">Generation</a>
            <a href="context.html" data-i18n="navCtx">Context window</a>
        </nav>
        <div class="edu-seg" role="group" aria-label="Language">
            <button class="lang-btn" data-lang="pl" type="button">PL</button>
            <button class="lang-btn" data-lang="en" type="button">EN</button>
        </div>
    </div>
</header>

<main class="wide-main">
<div>

    <!-- Title -->
    <header class="page-header">
        <h1 class="app-title" data-i18n="title">LLM Text Generation Simulation</h1>
    </header>

    <div id="app" class="app-layout" data-phase="idle" data-step="0">
    <div class="app-column">

    <!-- Control Panel -->
    <div class="edu-card rail mb-4">
        <div class="card-head">
            <span class="badge tone-ink"><i data-lucide="sliders-horizontal" class="ic"></i></span>
            <h3 class="card-title" data-i18n="controlsTitle">Prompt and temperature</h3>
            <span class="head-meta">
                <span class="meta-label"><span data-i18n="step">Step</span> <span id="stepCount">0</span></span>
                <span id="phaseChip" class="sr-only" role="status" aria-live="polite"></span>
            </span>
        </div>
        <div class="card-body">

        <!-- Top row: prompt + temperature + buttons -->
        <div class="flex flex-wrap items-center gap-3">
            <!-- Prompt -->
            <div class="flex items-center gap-2 mr-auto">
                <span class="field-label" data-i18n="prompt">Prompt</span>
                <span id="fixedPromptDisplay" class="font-mono text-sm bg-slate-100 border border-slate-200 text-slate-700 px-3 py-1.5 rounded-xl"></span>
            </div>

            <!-- Temperature toggle -->
            <div class="flex items-center gap-2.5">
                <span class="field-label" data-i18n="temperature">Temperature</span>
                <div class="edu-seg !ml-0">
                    <button id="tempBtn0" class="temp-btn active">0</button>
                    <button id="tempBtn1" class="temp-btn">1</button>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="flex items-center gap-2">
                <button id="startButton" class="edu-btn edu-btn-primary">
                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M6.9998 18C6.2427 17.7657 5.9998 17.4074 5.9998 17V7C5.9998 6.59264 6.2427 6.23431 6.61793 6.07638C6.99317 5.91844 7.43928 5.94428 7.78508 6.14281L17.7851 11.1428C18.0992 11.3223 18.2855 11.655 18.2855 12C18.2855 12.345 18.0992 12.6777 17.7851 12.8572L7.78508 17.8572C7.59286 17.9608 7.38137 18.0093 7.17275 18.0093C7.11486 18.0094 7.05705 18.0047 6.9998 18Z"/></svg>
                    <span data-i18n="start">Start</span>
                </button>
                <button id="resetButton" class="edu-btn edu-btn-ghost" disabled>
                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C16.1073 2 19.6007 4.51851 21.1604 8H18.8677C17.4742 5.88671 14.9051 4.5 12 4.5C7.85786 4.5 4.5 7.85786 4.5 12C4.5 16.1421 7.85786 19.5 12 19.5C14.9051 19.5 17.4742 18.1133 18.8677 16H21.1604C19.6007 19.4815 16.1073 22 12 22ZM19 10H22V7L19 10Z"/></svg>
                    <span data-i18n="reset">Reset</span>
                </button>
            </div>
        </div>

        </div>
    </div>

    <!-- Visualization Area: always visible; idle shows the structure before a run -->
    <div id="visualizationArea" class="space-y-3">

        <!-- Context panel -->
        <div class="edu-card rail fade-in">
            <div class="card-head">
                <span class="badge tone-blue"><i data-lucide="layers" class="ic"></i></span>
                <h3 class="card-title" data-i18n="contextTitle">Context: subword tokens</h3>
                <span id="tokenCount" class="ml-auto whitespace-nowrap font-mono text-xs text-slate-400 bg-slate-50 border border-slate-200 px-2 py-0.5 rounded-full"></span>
            </div>
            <div class="card-body">
            <div id="contextDisplay" class="flex flex-wrap min-h-[2.5rem] items-start"></div>
            </div>
            <div class="card-foot" aria-label="Legend">
                <span class="legend-item"><span class="swatch prompt-token"></span><span class="meta-label" data-i18n="legendPrompt">prompt</span></span>
                <span class="legend-item"><span class="swatch context-token"></span><span class="meta-label" data-i18n="legendGenerated">generated</span></span>
                <span class="legend-item"><span class="swatch eos-token"></span><span class="meta-label" data-i18n="legendEos">end of text</span></span>
                <span class="legend-item"><span class="swatch next-slot"></span><span class="meta-label" data-i18n="legendNext">next token</span></span>
            </div>
        </div>

        <!-- Connector -->
        <div class="rail-offset flex items-center gap-3 px-2">
            <div class="h-px flex-1 bg-slate-200"></div>
            <div class="flex items-center gap-1.5 font-mono text-[11px] text-slate-400 font-medium uppercase tracking-wider">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span data-i18n="autoStep">auto-regressive step</span>
            </div>
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            <div class="h-px flex-1 bg-slate-200"></div>
        </div>

        <!-- Predicted token panel -->
        <div class="edu-card rail">
            <div class="card-head">
                <span class="badge tone-green"><i data-lucide="chart-bar" class="ic"></i></span>
                <h3 class="card-title" data-i18n="predictedTitle">Predicted next token</h3>
                <span class="ml-auto font-mono text-[11px] text-slate-400 uppercase tracking-wider" data-i18n="topCandidates">top candidates</span>
            </div>
            <div class="card-body">
            <div id="nextTokenDisplay" class="space-y-2 min-h-[5rem]"></div>
            </div>
        </div>

        <!-- Generate button -->
        <button id="nextTokenButton" class="rail-offset edu-btn edu-btn-primary py-3" disabled>
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M13.1717 12.0007L8.22192 7.05093C7.83139 6.66041 7.83139 6.02724 8.22192 5.63672C8.61244 5.24619 9.24561 5.24619 9.63613 5.63672L15.293 11.2936C15.6835 11.6841 15.6835 12.3173 15.293 12.7078L9.63613 18.3646C9.24561 18.7551 8.61244 18.7551 8.22192 18.3646C7.83139 17.9741 7.83139 17.3409 8.22192 16.9504L13.1717 12.0007Z"/></svg>
            <span data-i18n="generate">Generate next token</span>
        </button>

        <!-- Output panel -->
        <div class="edu-card rail">
            <div class="card-head">
                <span class="badge tone-grape"><i data-lucide="file-text" class="ic"></i></span>
                <h3 class="card-title" data-i18n="outputTitle">Generated text</h3>
            </div>
            <div class="card-body">
            <div id="outputDisplay" class="text-base font-medium text-slate-700 leading-relaxed min-h-[1.75rem]"></div>
            </div>
        </div>

    </div>
    </div><!-- /app-column -->

    <!-- Guide: what each box does -->
    <aside class="app-guide" aria-label="Guide">
        <div class="guide-card">
            <h4><span class="badge badge-sm tone-ink"><i data-lucide="sliders-horizontal" class="ic"></i></span><span data-i18n="guidePromptTitle"></span></h4>
            <p data-i18n="guidePromptBody"></p>
        </div>
        <div class="guide-card">
            <h4><span class="badge badge-sm tone-blue"><i data-lucide="layers" class="ic"></i></span><span data-i18n="guideContextTitle"></span></h4>
            <p data-i18n="guideContextBody"></p>
        </div>
        <div class="guide-card">
            <h4><span class="badge badge-sm tone-green"><i data-lucide="chart-bar" class="ic"></i></span><span data-i18n="guidePredictTitle"></span></h4>
            <p data-i18n="guidePredictBody"></p>
        </div>
        <div class="guide-card">
            <h4><span class="badge badge-sm tone-grape"><i data-lucide="file-text" class="ic"></i></span><span data-i18n="guideOutputTitle"></span></h4>
            <p data-i18n="guideOutputBody"></p>
        </div>
    </aside>
    </div><!-- /app-layout -->
</div>
</main>

<script>
    // ─── DOM refs ──────────────────────────────────────────────────────────────
    const fixedPromptDisplay = document.getElementById('fixedPromptDisplay');
    const startButton        = document.getElementById('startButton');
    const resetButton        = document.getElementById('resetButton');
    const nextTokenButton    = document.getElementById('nextTokenButton');
    const contextDisplay     = document.getElementById('contextDisplay');
    const nextTokenDisplay   = document.getElementById('nextTokenDisplay');
    const outputDisplay      = document.getElementById('outputDisplay');
    const tokenCount         = document.getElementById('tokenCount');
    const appRoot            = document.getElementById('app');
    const phaseChip          = document.getElementById('phaseChip');
    const stepCount          = document.getElementById('stepCount');

    // ─── i18n ─────────────────────────────────────────────────────────────────
    const T = {
        pl: {
            navGen:            'Generowanie',
            navCtx:            'Okno kontekstu',
            docTitle:          'Symulacja generowania tekstu przez LLM · edulab',
            title:             'Symulacja generowania tekstu przez LLM',
            prompt:            'Prompt',
            temperature:       'Temperatura',
            start:             'Start',
            reset:             'Reset',
            contextTitle:      'Kontekst: tokeny',
            clickStart:        'Kliknij Start, żeby zacząć...',
            autoStep:          'krok autoregresyjny',
            predictedTitle:    'Przewidywany kolejny token',
            topCandidates:     'najbardziej prawdopodobne',
            generate:          'Wygeneruj kolejny token',
            clickGenerate:     'Kliknij „Wygeneruj kolejny token”...',
            outputTitle:       'Wygenerowana odpowiedź',
            outputPlaceholder: 'Tu pojawi się wygenerowana odpowiedź...',
            noOutput:          'Nic nie wygenerowano.',
            waiting:           '...',
            complete:          'Generowanie zakończone',
            completeEos:       'Generowanie zakończone: [EOS]',
            maxLength:         'Osiągnięto maksymalną długość',
            controlsTitle:     'Prompt i temperatura',
            step:              'Krok',
            phaseIdle:         'Gotowe do startu',
            phaseRunning:      'Generowanie',
            phaseDone:         'Zakończono',
            legendPrompt:      'prompt',
            legendGenerated:   'wygenerowane',
            legendEos:         'koniec tekstu',
            legendNext:        'kolejny token',
            guidePromptTitle:  'Prompt i temperatura',
            guidePromptBody:   'Prompt to pytanie, jak w czacie. Model pisze odpowiedź token po tokenie i każdy kolejny wybiera na podstawie pytania oraz tego, co już napisał. Przy temperaturze 0 zawsze bierze najbardziej prawdopodobny token. Przy temperaturze 1 losuje w proporcji do prawdopodobieństw, więc każde uruchomienie może dać inną odpowiedź.',
            guideContextTitle: 'Kontekst',
            guideContextBody:  'Wszystko, co model „widzi” w danym kroku: tokeny promptu (niebieskie) i tokeny już wygenerowane (zielone). Każdy nowy token trafia tutaj i wpływa na następne przewidywanie.',
            guidePredictTitle: 'Przewidywany kolejny token',
            guidePredictBody:  'Pięć najbardziej prawdopodobnych tokenów wraz z ich prawdopodobieństwami. Podświetlony wiersz to token, który model wybrał. [EOS] to osobny token, którym model kończy generowanie.',
            guideOutputTitle:  'Wygenerowana odpowiedź',
            guideOutputBody:   'Tokeny sklejone z powrotem w zwykły tekst: kawałki zaczynające się od ## doklejają się do poprzedniego słowa, a znaki interpunkcyjne do wyrazu przed nimi.',
        },
        en: {
            navGen:            'Generation',
            navCtx:            'Context window',
            docTitle:          'LLM Text Generation Simulation · edulab',
            title:             'LLM Text Generation Simulation',
            prompt:            'Prompt',
            temperature:       'Temperature',
            start:             'Start',
            reset:             'Reset',
            contextTitle:      'Context: subword tokens',
            clickStart:        'Click Start to begin...',
            autoStep:          'auto-regressive step',
            predictedTitle:    'Predicted next token',
            topCandidates:     'top candidates',
            generate:          'Generate next token',
            clickGenerate:     'Click Generate next token...',
            outputTitle:       'Generated answer',
            outputPlaceholder: 'The generated answer will appear here...',
            noOutput:          'No output generated.',
            waiting:           '...',
            complete:          'Generation complete',
            completeEos:       'Generation complete: [EOS]',
            maxLength:         'Max length reached',
            controlsTitle:     'Prompt and temperature',
            step:              'Step',
            phaseIdle:         'Ready to start',
            phaseRunning:      'Generating',
            phaseDone:         'Finished',
            legendPrompt:      'prompt',
            legendGenerated:   'generated',
            legendEos:         'end of text',
            legendNext:        'next token',
            guidePromptTitle:  'Prompt and temperature',
            guidePromptBody:   'The prompt is a question, as in a chat. The model writes the answer token by token, choosing each one based on the question and on what it has written so far. At temperature 0 it always takes the most probable token. At temperature 1 it samples in proportion to the probabilities, so each run can produce a different answer.',
            guideContextTitle: 'Context',
            guideContextBody:  'Everything the model "sees" at a given step: the prompt tokens (blue) and the tokens generated so far (green). Each new token lands here and shapes the next prediction.',
            guidePredictTitle: 'Predicted next token',
            guidePredictBody:  'The five most probable candidates for the next token with their probabilities. The highlighted row is the token the model picked. [EOS] is a separate token the model uses to stop generating.',
            guideOutputTitle:  'Generated answer',
            guideOutputBody:   'The tokens glued back into plain text: pieces starting with ## attach to the previous word, and punctuation attaches to the word before it.',
        },
    };
    let lang = 'en';
    const t = key => (T[lang] && T[lang][key]) ?? T.en[key] ?? key;

    // "n tokens" with Polish plural forms
    function tokenCountLabel(n) {
        if (lang === 'pl') {
            const m10 = n % 10, m100 = n % 100;
            const word = n === 1 ? 'token'
                       : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? 'tokeny'
                       : 'tokenów';
            return `${n} ${word}`;
        }
        return `${n} ${n === 1 ? 'token' : 'tokens'}`;
    }

    function applyLanguage() {
        document.documentElement.lang = lang;
        document.title = t('docTitle');
        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll('.lang-btn').forEach(btn => {
            const on = btn.dataset.lang === lang;
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-pressed', on);
        });
        tokenCount.textContent = tokenCountLabel(currentContextTokens.length);
    }

    function setLanguage(l) {
        const next = T[l] ? l : 'en';
        const changed = next !== lang;
        lang = next;
        saveLanguage(lang);
        if (changed) resetApplication();   // each language has its own prompt + model
        applyLanguage();
    }

    // ─── Constants ────────────────────────────────────────────────────────────
    // The prompt and model are per language: see EXAMPLES below. Both prompts
    // are chat questions; the model writes the answer token by token.
    const EOS_TOKEN         = "[EOS]";
    const TOP_K             = 5;   // surface up to 5 candidates so the distribution is visible
                                   // (suffix steps like "##ist" are legitimately near-certain)
    const MAX_GEN_TOKENS    = 64;   // safety cap; with [EOS] ~0.86 per sentence this is ~never hit
    const SKELETON_BARS     = [58, 21, 11, 6, 4];   // idle rows hint at a falling distribution
    const PHASES = {                                // phase → [status label key]
        idle:    ['phaseIdle'],
        running: ['phaseRunning'],
        done:    ['phaseDone'],
    };

    // ─── State ────────────────────────────────────────────────────────────────
    let promptTokens        = [];
    let currentContextTokens= [];
    let generatedTokens     = [];
    let currentState        = null;   // node in MODEL (see below); encodes the context so far
    let generationComplete  = false;
    let temperature         = 0;  // 0 = greedy (argmax), 1 = sample from the distribution

    // ─── Subword maps (prompt tokenisation only) ──────────────────────────────
    // Only the fixed prompt is tokenised here; one word in each prompt splits
    // into pieces. (Generation tokens come from the models below.)
    const SUBWORD_EN = { "Einstein":   ["Ein", "##stein"] };
    const SUBWORD_PL = { "Skłodowska": ["Skłodow", "##ska"] };

    // ─── Model ────────────────────────────────────────────────────────────────
    // A real LLM is a neural network that reads the ENTIRE context and outputs a
    // probability distribution over its whole vocabulary for the next token. We
    // can't ship a transformer in a teaching demo, so we approximate the part
    // that matters with a tiny hand-authored model: a finite-state graph.
    //
    // Each STATE represents "where we are given everything generated so far"
    // (so it stands in for the full context, the way a real model's hidden state
    // does). Each state lists its candidate next tokens, their probabilities,
    // and which state each one leads to. Properties that keep this honest AND
    // robust at any temperature:
    //   • EVERY state offers 5 candidates, so the picked token is always shown as
    //     one option drawn from a real distribution (the point of the demo).
    //   • Tokens are SUBWORDS, like a real tokeniser: words such as "physicist",
    //     "developed" and "relativity" are emitted in pieces (physic + ##ist,
    //     develop + ##ed, relativ + ##ity). Each suffix step shows 5 candidate
    //     pieces — peaked on the dominant one (##ist, ##ed, ##ity) with a
    //     realistic low-probability tail, exactly like a real subword vocabulary.
    //     Some words are single tokens (scientist, theorist): a realistic mix of
    //     pieces and whole words.
    //   • [EOS] is a real vocabulary token. Generation stops only when the model
    //     explicitly SELECTS [EOS] — the period "." is a separate, earlier
    //     token. After each sentence the model RETURNS to the [EOS] decision
    //     (emit [EOS] and stop, or start another sentence). [EOS] is highly
    //     likely once a sentence is complete, so generation terminates quickly;
    //     a hard token cap bounds the rare long run. That is exactly how a real
    //     model decides it is "done".
    //   • Candidates are chosen so the likely paths stay grammatical, so T=1
    //     yields coherent ALTERNATIVES, not word salad (only the low-probability
    //     subword tail is occasionally non-standard, as in real sampling).
    //
    // Greedy (T=0)  → "Albert Einstein was a German physicist who developed the
    //                 theory of relativity."
    // Sampled (T=1) → e.g. "He was a brilliant scientist who published a concept
    //                 of gravity." — a different, still-coherent path each run.
    const MODEL_EN = {
        //  state      candidate tokens (token / prob / next state) ───────────────────
        // the answer opens by naming the subject, as chat answers usually do
        E0:        [ {token:"Albert",       prob:0.60, next:"E_name"},
                     {token:"He",           prob:0.22, next:"E_was"},
                     {token:"Einstein",     prob:0.10, next:"E_was"},
                     {token:"A",            prob:0.05, next:"S0"},        // "A German physicist who..."
                     {token:"Ein",          prob:0.03, next:"E_stein"} ],
        E_name:    [ {token:"Ein",          prob:0.95, next:"E_stein"},
                     {token:"Einstein",     prob:0.02, next:"E_was"},
                     {token:"was",          prob:0.01, next:"E_a"},
                     {token:"Einstien",     prob:0.01, next:"E_was"},     // misspelling in the tail
                     {token:"Eins",         prob:0.01, next:"E_tein"} ],
        // subword step: continuations of "Ein" — sharply peaked on ##stein
        E_stein:   [ {token:"##stein",      prob:0.96, next:"E_was"},
                     {token:"##stien",      prob:0.01, next:"E_was"},
                     {token:"##stine",      prob:0.01, next:"E_was"},
                     {token:"##sten",       prob:0.01, next:"E_was"},
                     {token:"##stain",      prob:0.01, next:"E_was"} ],
        E_tein:    [ {token:"##tein",       prob:0.95, next:"E_was"},
                     {token:"##teins",      prob:0.02, next:"E_was"},
                     {token:"##tain",       prob:0.01, next:"E_was"},
                     {token:"##ten",        prob:0.01, next:"E_was"},
                     {token:"##tien",       prob:0.01, next:"E_was"} ],
        E_was:     [ {token:"was",          prob:0.94, next:"E_a"},
                     {token:"is",           prob:0.03, next:"E_a"},
                     {token:"became",       prob:0.02, next:"E_a"},
                     {token:"remains",      prob:0.005, next:"E_a"},
                     {token:"proved",       prob:0.005, next:"E_a"} ],
        E_a:       [ {token:"a",            prob:0.90, next:"S0"},
                     {token:"the",          prob:0.05, next:"S0"},
                     {token:"also",         prob:0.02, next:"E_a"},
                     {token:"truly",        prob:0.02, next:"E_a"},
                     {token:"once",         prob:0.01, next:"E_a"} ],
        S0:        [ {token:"German",       prob:0.30, next:"S_role"},
                     {token:"brilliant",    prob:0.24, next:"S_role"},
                     {token:"theoretical",  prob:0.20, next:"S_role"},
                     {token:"renowned",     prob:0.16, next:"S_role"},
                     {token:"famous",       prob:0.10, next:"S_role"} ],
        // role nouns: "physic" is split (then a 2-way subword choice); the rest
        // are single-token words — a realistic mix of word-pieces and whole words
        S_role:    [ {token:"physic",       prob:0.40, next:"S_physic"},
                     {token:"scientist",    prob:0.22, next:"S_link"},
                     {token:"genius",       prob:0.16, next:"S_link"},
                     {token:"theorist",     prob:0.12, next:"S_link"},
                     {token:"thinker",      prob:0.10, next:"S_link"} ],
        // subword step: 5 continuations of "physic" — sharply peaked on ##ist
        // with a thin low-probability tail (just like a real tokeniser's vocab)
        S_physic:  [ {token:"##ist",        prob:0.93, next:"S_link"},    // physicist
                     {token:"##ian",        prob:0.03, next:"S_link"},    // physician
                     {token:"##ists",       prob:0.02, next:"S_link"},    // physicists
                     {token:"##s",          prob:0.01, next:"S_link"},    // physics
                     {token:"##al",         prob:0.01, next:"S_link"} ],  // physical
        // a relative clause continues the sentence; or the model can end the
        // sentence here with punctuation, then still select [EOS] to stop
        S_link:    [ {token:"who",          prob:0.70, next:"S_verb"},
                     {token:"that",         prob:0.16, next:"S_verb"},
                     {token:".",            prob:0.08, next:"S_eos"},
                     {token:"!",            prob:0.04, next:"S_eos"},
                     {token:"...",          prob:0.02, next:"S_eos"} ],
        // verb stems — all share the "##ed" suffix
        S_verb:    [ {token:"develop",      prob:0.38, next:"S_ed"},
                     {token:"present",      prob:0.22, next:"S_ed"},
                     {token:"publish",      prob:0.18, next:"S_ed"},
                     {token:"perfect",      prob:0.12, next:"S_ed"},
                     {token:"defend",       prob:0.10, next:"S_ed"} ],
        // subword step: 5 continuations of a verb stem — sharply peaked on ##ed
        S_ed:      [ {token:"##ed",         prob:0.93, next:"S_det"},     // developed
                     {token:"##s",          prob:0.04, next:"S_det"},     // develops
                     {token:"##ing",        prob:0.01, next:"S_det"},     // developing
                     {token:"##ment",       prob:0.01, next:"S_det"},     // development
                     {token:"##ers",        prob:0.01, next:"S_det"} ],   // developers
        S_det:     [ {token:"the",          prob:0.50, next:"S_noun"},
                     {token:"his",          prob:0.24, next:"S_noun"},
                     {token:"a",            prob:0.12, next:"S_noun"},
                     {token:"this",         prob:0.08, next:"S_noun"},
                     {token:"that",         prob:0.06, next:"S_noun"} ],
        // consonant-initial nouns only, so "a ___" is always grammatical
        S_noun:    [ {token:"theory",       prob:0.50, next:"S_prep"},
                     {token:"concept",      prob:0.18, next:"S_prep"},
                     {token:"principle",    prob:0.14, next:"S_prep"},
                     {token:"framework",    prob:0.10, next:"S_prep"},
                     {token:"model",        prob:0.08, next:"S_prep"} ],
        S_prep:    [ {token:"of",           prob:0.80, next:"S_topic"},
                     {token:"behind",       prob:0.08, next:"S_topic"},
                     {token:"about",        prob:0.06, next:"S_topic"},
                     {token:"underlying",   prob:0.04, next:"S_topic"},
                     {token:"regarding",    prob:0.02, next:"S_topic"} ],
        // topic nouns — "relativity" is split (relativ + ##ity), the rest whole
        S_topic:   [ {token:"relativ",      prob:0.52, next:"S_ity"},
                     {token:"gravity",      prob:0.18, next:"S_end"},
                     {token:"spacetime",    prob:0.12, next:"S_end"},
                     {token:"light",        prob:0.10, next:"S_end"},
                     {token:"energy",       prob:0.08, next:"S_end"} ],
        // subword step: 5 continuations of "relativ" — sharply peaked on ##ity
        S_ity:     [ {token:"##ity",        prob:0.93, next:"S_end"},     // relativity
                     {token:"##ism",        prob:0.03, next:"S_end"},     // relativism
                     {token:"##ist",        prob:0.02, next:"S_end"},     // relativist
                     {token:"##istic",      prob:0.01, next:"S_end"},     // relativistic
                     {token:"##ities",      prob:0.01, next:"S_end"} ],   // relativities
        // sentence-final punctuation — a normal token, chosen before EOS
        S_end:     [ {token:".",            prob:0.90, next:"S_eos"},
                     {token:"!",            prob:0.05, next:"S_eos"},
                     {token:"...",          prob:0.03, next:"S_eos"},
                     {token:"?",            prob:0.01, next:"S_eos"},
                     {token:";",            prob:0.01, next:"S_eos"} ],
        // THE STOP STEP: the model explicitly selects [EOS] to end generation.
        // It usually wins, but may instead start a new sentence. Every finished
        // sentence comes back here, so this 5-way [EOS] decision recurs (bounded
        // by [EOS]'s high probability and the MAX_GEN_TOKENS cap).
        S_eos:     [ {token:EOS_TOKEN,      prob:0.86, next:null},
                     {token:"He",           prob:0.05, next:"S2_verb"},
                     {token:"It",           prob:0.04, next:"S2_verb"},
                     {token:"This",         prob:0.03, next:"S2_verb"},
                     {token:"That",         prob:0.02, next:"S2_verb"} ],
        // a further sentence (reached only if [EOS] was NOT selected above)
        S2_verb:   [ {token:"changed",      prob:0.40, next:"S2_obj"},
                     {token:"transformed",  prob:0.22, next:"S2_obj"},
                     {token:"shaped",       prob:0.16, next:"S2_obj"},
                     {token:"reshaped",     prob:0.12, next:"S2_obj"},
                     {token:"redefined",    prob:0.10, next:"S2_obj"} ],
        S2_obj:    [ {token:"physics",      prob:0.40, next:"S2_end"},
                     {token:"science",      prob:0.24, next:"S2_end"},
                     {token:"everything",   prob:0.16, next:"S2_end"},
                     {token:"cosmology",    prob:0.10, next:"S2_end"},
                     {token:"history",      prob:0.10, next:"S2_end"} ],
        S2_end:    [ {token:".",            prob:0.90, next:"S_eos"},     // back to the [EOS] decision
                     {token:"!",            prob:0.05, next:"S_eos"},
                     {token:"...",          prob:0.03, next:"S_eos"},
                     {token:"?",            prob:0.01, next:"S_eos"},
                     {token:";",            prob:0.01, next:"S_eos"} ],
    };

    // ─── Polish model ─────────────────────────────────────────────────────────
    // Same construction, Polish text. The prompt is the question "Kim była Maria
    // Skłodowska-Curie?"; the answer restates the name ("Skłodowska" splits into
    // Skłodow + ##ska, and "-" is its own token) and then follows the graph. Inflection makes the subword steps very natural here: fizy +
    // ##czką (fizyczką), odkry + ##ła (odkryła), pierwiast + ##ek, promienio +
    // ##twórczość. Every candidate keeps the sentence grammatical (feminine
    // instrumental after "była", feminine past-tense verbs), so T=1 gives
    // coherent alternatives.
    //
    // Greedy (T=0)  → "Maria Skłodowska-Curie była polską fizyczką, która
    //                 odkryła polon i rad."
    // Sampled (T=1) → e.g. "Była wybitną uczoną, gdyż zbadała nowy pierwiastek
    //                 oraz promieniotwórczość." — a different path each run.
    const MODEL_PL = {
        //  state      candidate tokens (token / prob / next state) ───────────────────
        // the answer opens by naming the subject (every path reaches the
        // instrumental after "była"/"jest", so P0 stays grammatical)
        PA0:       [ {token:"Maria",        prob:0.60, next:"PA_name"},
                     {token:"Była",         prob:0.24, next:"P0"},
                     {token:"Ona",          prob:0.08, next:"PA_byla"},
                     {token:"Marie",        prob:0.05, next:"PA_curie"},
                     {token:"Skłodow",      prob:0.03, next:"PA_ska"} ],
        PA_name:   [ {token:"Skłodow",      prob:0.95, next:"PA_ska"},
                     {token:"Curie",        prob:0.02, next:"PA_byla"},
                     {token:"Skłodowska",   prob:0.01, next:"PA_dash"},
                     {token:"była",         prob:0.01, next:"P0"},
                     {token:"Sklodow",      prob:0.01, next:"PA_ska"} ],
        // subword step: continuations of "Skłodow" — sharply peaked on ##ska
        PA_ska:    [ {token:"##ska",        prob:0.96, next:"PA_dash"},
                     {token:"##skiej",      prob:0.02, next:"PA_dash"},
                     {token:"##ski",        prob:0.01, next:"PA_dash"},
                     {token:"##scy",        prob:0.005, next:"PA_dash"},
                     {token:"##sk",         prob:0.005, next:"PA_dash"} ],
        PA_dash:   [ {token:"-",            prob:0.90, next:"PA_curie"},
                     {token:"była",         prob:0.07, next:"P0"},
                     {token:"Curie",        prob:0.01, next:"PA_byla"},
                     {token:"jest",         prob:0.01, next:"P0"},
                     {token:"pozostaje",    prob:0.01, next:"P0"} ],
        PA_curie:  [ {token:"Curie",        prob:0.97, next:"PA_byla"},
                     {token:"Curié",        prob:0.01, next:"PA_byla"},
                     {token:"Kiri",         prob:0.01, next:"PA_byla"},
                     {token:"Cury",         prob:0.005, next:"PA_byla"},
                     {token:"Curi",         prob:0.005, next:"PA_byla"} ],
        PA_byla:   [ {token:"była",         prob:0.94, next:"P0"},
                     {token:"jest",         prob:0.03, next:"P0"},
                     {token:"została",      prob:0.01, next:"P0"},
                     {token:"pozostaje",    prob:0.01, next:"P0"},
                     {token:"pozostała",    prob:0.01, next:"P0"} ],
        P0:        [ {token:"polską",       prob:0.30, next:"P_role"},
                     {token:"wybitną",      prob:0.24, next:"P_role"},
                     {token:"pierwszą",     prob:0.20, next:"P_role"},
                     {token:"słynną",       prob:0.16, next:"P_role"},
                     {token:"genialną",     prob:0.10, next:"P_role"} ],
        // role nouns: "fizy" is split (fizyczką); the rest are whole tokens
        P_role:    [ {token:"fizy",         prob:0.40, next:"P_fizy"},
                     {token:"uczoną",       prob:0.22, next:"P_link"},
                     {token:"badaczką",     prob:0.16, next:"P_link"},
                     {token:"chemiczką",    prob:0.12, next:"P_link"},
                     {token:"noblistką",    prob:0.10, next:"P_link"} ],
        // subword step: continuations of "fizy" — peaked on ##czką
        P_fizy:    [ {token:"##czką",       prob:0.93, next:"P_link"},    // fizyczką
                     {token:"##kiem",       prob:0.03, next:"P_link"},    // fizykiem
                     {token:"##ką",         prob:0.02, next:"P_link"},    // fizyką
                     {token:"##czki",       prob:0.01, next:"P_link"},    // fizyczki
                     {token:"##cy",         prob:0.01, next:"P_link"} ],  // fizycy
        // a comma opens a relative clause; or the sentence ends here
        P_link:    [ {token:",",            prob:0.72, next:"P_rel"},
                     {token:".",            prob:0.16, next:"P_eos"},
                     {token:"!",            prob:0.06, next:"P_eos"},
                     {token:"...",          prob:0.04, next:"P_eos"},
                     {token:";",            prob:0.02, next:"P_eos"} ],
        // relative / causal connectors — each one is followed by a verb
        P_rel:     [ {token:"która",        prob:0.80, next:"P_verb"},
                     {token:"gdyż",         prob:0.08, next:"P_verb"},
                     {token:"jaka",         prob:0.06, next:"P_verb"},
                     {token:"bo",           prob:0.04, next:"P_verb"},
                     {token:"co",           prob:0.02, next:"P_verb"} ],
        // verb stems — all take the feminine past-tense ending ##ła
        P_verb:    [ {token:"odkry",        prob:0.38, next:"P_la"},
                     {token:"zbada",        prob:0.22, next:"P_la"},
                     {token:"opisa",        prob:0.18, next:"P_la"},
                     {token:"wyizolowa",    prob:0.12, next:"P_la"},
                     {token:"otrzyma",      prob:0.10, next:"P_la"} ],
        // subword step: past-tense endings — peaked on ##ła
        P_la:      [ {token:"##ła",         prob:0.93, next:"P_obj"},     // odkryła
                     {token:"##ł",          prob:0.04, next:"P_obj"},     // odkrył
                     {token:"##li",         prob:0.01, next:"P_obj"},     // odkryli
                     {token:"##ły",         prob:0.01, next:"P_obj"},     // odkryły
                     {token:"##wszy",       prob:0.01, next:"P_obj"} ],   // odkrywszy
        // object: an element by name, or an adjective + "pierwiastek"
        P_obj:     [ {token:"polon",        prob:0.50, next:"P_conjP"},
                     {token:"rad",          prob:0.18, next:"P_conjR"},
                     {token:"nowy",         prob:0.14, next:"P_pierw"},
                     {token:"nieznany",     prob:0.10, next:"P_pierw"},
                     {token:"kolejny",      prob:0.08, next:"P_pierw"} ],
        P_pierw:   [ {token:"pierwiast",    prob:0.62, next:"P_ek"},
                     {token:"metal",        prob:0.20, next:"P_conjP"},
                     {token:"izotop",       prob:0.12, next:"P_conjP"},
                     {token:"składnik",     prob:0.04, next:"P_conjP"},
                     {token:"minerał",      prob:0.02, next:"P_conjP"} ],
        // subword step: continuations of "pierwiast" — peaked on ##ek
        P_ek:      [ {token:"##ek",         prob:0.93, next:"P_conjP"},   // pierwiastek
                     {token:"##ki",         prob:0.03, next:"P_conjP"},   // pierwiastki
                     {token:"##ka",         prob:0.02, next:"P_conjP"},   // pierwiastka
                     {token:"##kowy",       prob:0.01, next:"P_conjP"},   // pierwiastkowy
                     {token:"##kach",       prob:0.01, next:"P_conjP"} ], // pierwiastkach
        // conjunction or sentence end; two variants so "rad i rad" cannot occur
        P_conjP:   [ {token:"i",            prob:0.60, next:"P_obj2R"},
                     {token:"oraz",         prob:0.20, next:"P_obj2R"},
                     {token:".",            prob:0.12, next:"P_eos"},
                     {token:"...",          prob:0.05, next:"P_eos"},
                     {token:"!",            prob:0.03, next:"P_eos"} ],
        P_conjR:   [ {token:"i",            prob:0.60, next:"P_obj2P"},
                     {token:"oraz",         prob:0.20, next:"P_obj2P"},
                     {token:".",            prob:0.12, next:"P_eos"},
                     {token:"...",          prob:0.05, next:"P_eos"},
                     {token:"!",            prob:0.03, next:"P_eos"} ],
        // second object — "promienio" is split (promienio + ##twórczość)
        P_obj2R:   [ {token:"rad",          prob:0.60, next:"P_end"},
                     {token:"promienio",    prob:0.20, next:"P_twor"},
                     {token:"uran",         prob:0.12, next:"P_end"},
                     {token:"tor",          prob:0.05, next:"P_end"},
                     {token:"aktyn",        prob:0.03, next:"P_end"} ],
        P_obj2P:   [ {token:"polon",        prob:0.60, next:"P_end"},
                     {token:"promienio",    prob:0.20, next:"P_twor"},
                     {token:"uran",         prob:0.12, next:"P_end"},
                     {token:"tor",          prob:0.05, next:"P_end"},
                     {token:"aktyn",        prob:0.03, next:"P_end"} ],
        P_twor:    [ {token:"##twórczość",  prob:0.93, next:"P_end"},     // promieniotwórczość
                     {token:"##twórcze",    prob:0.03, next:"P_end"},     // promieniotwórcze
                     {token:"##wanie",      prob:0.02, next:"P_end"},     // promieniowanie
                     {token:"##twórczy",    prob:0.01, next:"P_end"},     // promieniotwórczy
                     {token:"##twórczości", prob:0.01, next:"P_end"} ],   // promieniotwórczości
        // sentence-final punctuation — a normal token, chosen before EOS
        P_end:     [ {token:".",            prob:0.90, next:"P_eos"},
                     {token:"!",            prob:0.05, next:"P_eos"},
                     {token:"...",          prob:0.03, next:"P_eos"},
                     {token:"?",            prob:0.01, next:"P_eos"},
                     {token:";",            prob:0.01, next:"P_eos"} ],
        // THE STOP STEP: [EOS] usually wins; otherwise a second sentence starts
        P_eos:     [ {token:EOS_TOKEN,      prob:0.86, next:null},
                     {token:"Otrzymała",    prob:0.06, next:"P2_obj"},
                     {token:"Zdobyła",      prob:0.04, next:"P2_obj"},
                     {token:"Dostała",      prob:0.02, next:"P2_obj"},
                     {token:"Odebrała",     prob:0.02, next:"P2_obj"} ],
        // "Otrzymała Nagrodę Nobla." / "Zdobyła dwie Nagrody Nobla."
        P2_obj:    [ {token:"Nagrodę",      prob:0.62, next:"P2_nob"},
                     {token:"dwie",         prob:0.22, next:"P2_nagrody"},
                     {token:"medal",        prob:0.08, next:"P2_end"},
                     {token:"sławę",        prob:0.05, next:"P2_end"},
                     {token:"uznanie",      prob:0.03, next:"P2_end"} ],
        P2_nagrody:[ {token:"Nagrody",      prob:0.88, next:"P2_nob"},
                     {token:"nagrody",      prob:0.06, next:"P2_nob"},
                     {token:"ważne",        prob:0.03, next:"P2_nagrody"},
                     {token:"kolejne",      prob:0.02, next:"P2_nagrody"},
                     {token:"wielkie",      prob:0.01, next:"P2_nagrody"} ],
        P2_nob:    [ {token:"Nobla",        prob:0.90, next:"P2_end"},
                     {token:"Nobel",        prob:0.04, next:"P2_end"},
                     {token:"noblowską",    prob:0.03, next:"P2_end"},
                     {token:"Nobl",         prob:0.02, next:"P2_end"},
                     {token:"Nobelu",       prob:0.01, next:"P2_end"} ],
        P2_end:    [ {token:".",            prob:0.90, next:"P_eos"},     // back to the [EOS] decision
                     {token:"!",            prob:0.05, next:"P_eos"},
                     {token:"...",          prob:0.03, next:"P_eos"},
                     {token:"?",            prob:0.01, next:"P_eos"},
                     {token:";",            prob:0.01, next:"P_eos"} ],
    };

    // ─── Examples: one per UI language ────────────────────────────────────────
    const EXAMPLES = {
        en: { prompt: "Who was Albert Einstein?",          subwords: SUBWORD_EN, model: MODEL_EN, start: "E0" },
        pl: { prompt: "Kim była Maria Skłodowska-Curie?",  subwords: SUBWORD_PL, model: MODEL_PL, start: "PA0" },
    };
    const example = () => EXAMPLES[lang] || EXAMPLES.en;

    // ─── Small UI helpers ──────────────────────────────────────────────────────
    // key is a T entry, so a language switch can re-render it via data-i18n
    const placeholder = key => `<span class="text-slate-400 italic text-sm" data-i18n="${key}">${t(key)}</span>`;

    // Drive the Generate button's enabled state, label, and colour in one place
    function setGenerateButton(enabled, labelKey, done = false) {
        nextTokenButton.disabled = !enabled;
        const span = nextTokenButton.querySelector('span');
        span.dataset.i18n = labelKey;
        span.textContent  = t(labelKey);
        nextTokenButton.classList.toggle('done', done);
    }

    // Phase + step drive the status chip and the DOM contract (data-phase / data-step on #app)
    function setPhase(phase) {
        const [key] = PHASES[phase];
        appRoot.dataset.phase = phase;
        phaseChip.dataset.i18n = key;   // announced to screen readers only
        phaseChip.textContent = t(key);
    }
    function setStep(n) {
        appRoot.dataset.step  = n;
        stepCount.textContent = n;
    }

    // ─── Temperature toggle ────────────────────────────────────────────────────
    const tempBtn0 = document.getElementById('tempBtn0');
    const tempBtn1 = document.getElementById('tempBtn1');
    tempBtn0.addEventListener('click', () => setTemperature(0));
    tempBtn1.addEventListener('click', () => setTemperature(1));

    function setTemperature(t) {
        temperature = t;
        [[tempBtn0, t === 0], [tempBtn1, t === 1]].forEach(([btn, on]) => {
            btn.classList.toggle('active', on);
        });
    }

    // ─── Tokenisation ──────────────────────────────────────────────────────────
    function basicTokenize(text) {
        return (text.match(/(\p{L}+|\d+|[^\p{L}\d\s])/gu) || []);
    }
    function applySubwordSplits(words) {
        return words.flatMap(w => example().subwords[w] || [w]);
    }

    // ─── Decoding (how a token is chosen from the distribution) ────────────────
    // T=0 → greedy: take the highest-probability candidate (argmax).
    // T=1 → sampling: draw a candidate at random in proportion to its
    //       probability. (Temperature really rescales the logits; T=0 and T=1
    //       are the two endpoints this demo contrasts.)
    function pickCandidate(sorted, temp) {
        if (temp === 0) {
            return { index: 0, adjustedProbs: sorted.map(c => c.prob) };
        }
        const sum = sorted.reduce((s, c) => s + c.prob, 0);
        const probs = sorted.map(c => c.prob / sum);   // normalise to a clean distribution
        let r = Math.random(), cum = 0;
        for (let i = 0; i < sorted.length; i++) {
            cum += probs[i];
            if (r <= cum) return { index: i, adjustedProbs: probs };
        }
        return { index: sorted.length - 1, adjustedProbs: probs };
    }

    function getNextPrediction(state) {
        const raw = example().model[state] || [];
        const sorted = [...raw].sort((a, b) => b.prob - a.prob);
        const { index, adjustedProbs } = pickCandidate(sorted, temperature);
        const chosen = sorted[index];
        return {
            selected:      chosen.token,
            nextState:     chosen.next,
            possibilities: sorted,
            adjustedProbs,
        };
    }

    // ─── Render: context ──────────────────────────────────────────────────────
    function tokenChip(text, cls) {
        const span = document.createElement('span');
        span.textContent = text;
        span.className = 'token ' + cls;
        return span;
    }
    // dashed slot where the next token will land (hidden from screen readers)
    function appendNextSlot() {
        const slot = tokenChip('…', 'next-slot');   // not "?": the prompt itself ends with one
        slot.setAttribute('aria-hidden', 'true');
        contextDisplay.appendChild(slot);
    }

    function renderContext(tokens, promptCount) {
        contextDisplay.innerHTML = '';
        tokens.forEach((tok, i) => {
            contextDisplay.appendChild(tokenChip(tok,
                tok === EOS_TOKEN ? 'eos-token' : i < promptCount ? 'prompt-token' : 'context-token'));
        });
        if (!generationComplete) appendNextSlot();
        tokenCount.textContent = tokenCountLabel(tokens.length);
    }

    // Idle: the prompt's words as ghost chips, before Start splits them into tokens
    function renderIdleContext() {
        contextDisplay.innerHTML = '';
        basicTokenize(example().prompt).forEach(w => contextDisplay.appendChild(tokenChip(w, 'ghost-token')));
        appendNextSlot();
        contextDisplay.insertAdjacentHTML('beforeend', `<div class="basis-full mt-2">${placeholder('clickStart')}</div>`);
        tokenCount.textContent = tokenCountLabel(0);
    }

    // Before the first prediction: empty rows in the shape of a distribution
    function renderSkeletonRows(hintKey) {
        nextTokenDisplay.innerHTML = `<div>${placeholder(hintKey)}</div>` + SKELETON_BARS.map((w, i) => `
            <div class="prob-row skeleton px-3 py-1" aria-hidden="true">
                <span class="ghost-chip" style="width:${84 - i * 10}px"></span>
                <div class="prob-bar-track"><div class="prob-bar-fill" style="width:${w}%"></div></div>
                <span class="pct">–%</span>
            </div>`).join('');
    }

    function renderIdleOutput() {
        outputDisplay.innerHTML = placeholder('outputPlaceholder')
            + '<div class="ghost-line" style="width:92%"></div><div class="ghost-line" style="width:61%"></div>';
    }

    // ─── Render: probability rows ──────────────────────────────────────────────
    function renderProbabilities(possibilities, selectedToken, adjustedProbs) {
        nextTokenDisplay.innerHTML = '';
        if (!possibilities || possibilities.length === 0) return;

        possibilities.slice(0, TOP_K).forEach((item, idx) => {
            const prob  = adjustedProbs[idx];
            const pct   = (prob * 100).toFixed(1);
            const isSelected = item.token === selectedToken;

            const row = document.createElement('div');
            row.className = `prob-row ${isSelected ? 'selected' : ''} px-3 py-1`;

            // Token chip | bar | percentage
            const chip = document.createElement('span');
            chip.textContent = item.token;
            chip.className = 'token ' + (item.token === EOS_TOKEN ? 'eos-token' : 'candidate-token');

            const pctSpan = document.createElement('span');
            pctSpan.className = 'pct';
            pctSpan.textContent = pct + '%';

            // Bar
            const track = document.createElement('div');
            track.className = 'prob-bar-track';
            const fill = document.createElement('div');
            fill.className = 'prob-bar-fill';
            fill.style.width = pct + '%';
            fill.style.background = isSelected ? '#FFFFFF' : '#625B53';   // edulab paper / ink-3 (literal: inline style)
            track.appendChild(fill);

            row.append(chip, track, pctSpan);
            nextTokenDisplay.appendChild(row);
        });
    }

    // ─── Text reconstruction ──────────────────────────────────────────────────
    function reconstructText(tokens) {
        let result = '';
        let glue = false;                  // after "-" the next word attaches directly
        const filtered = tokens.filter(t => t !== EOS_TOKEN);
        for (let i = 0; i < filtered.length; i++) {
            const tok = filtered[i];
            if (tok.startsWith('##')) {
                result += tok.slice(2);
            } else if (tok === '-') {
                result = result.trimEnd() + tok;
                glue = true;
                continue;
            } else if (/^[.,!?;:]+$/.test(tok)) {
                result = result.trimEnd() + tok;
            } else {
                result += (i === 0 || glue ? '' : ' ') + tok;
            }
            glue = false;
        }
        return result.trim();
    }

    // ─── Generation step ──────────────────────────────────────────────────────
    function nextTokenStep() {
        if (generationComplete || !currentState) return;

        const { selected: nextToken, nextState, possibilities, adjustedProbs } = getNextPrediction(currentState);
        const promptCount = promptTokens.length;

        // a step is terminal when the chosen token ends the text (no next state),
        // or as a safety cap on length
        const hitMax = generatedTokens.length >= MAX_GEN_TOKENS;
        const isTerminal = nextState === null || hitMax;

        if (isTerminal) {
            generationComplete = true;
            currentContextTokens.push(nextToken);          // ending token visible in context
            if (nextToken !== EOS_TOKEN) generatedTokens.push(nextToken);  // keep "." etc. in the output
            currentState = null;
            renderContext(currentContextTokens, promptCount);
            renderProbabilities(possibilities, nextToken, adjustedProbs);

            setGenerateButton(false,
                hitMax ? 'maxLength'
                       : nextToken === EOS_TOKEN ? 'completeEos'
                                                 : 'complete', true);
        } else {
            currentContextTokens.push(nextToken);
            generatedTokens.push(nextToken);
            currentState = nextState;              // advance: the new token becomes part of the context
            renderContext(currentContextTokens, promptCount);
            renderProbabilities(possibilities, nextToken, adjustedProbs);
        }

        setStep(currentContextTokens.length - promptCount);
        if (generationComplete) setPhase('done');

        const text = reconstructText(generatedTokens);
        outputDisplay.textContent = text || '';
        if (!text && generationComplete) {
            outputDisplay.innerHTML = placeholder('noOutput');
        }
    }

    // ─── Init / reset ─────────────────────────────────────────────────────────
    function initializeGeneration() {
        promptTokens          = applySubwordSplits(basicTokenize(example().prompt));
        currentContextTokens  = [...promptTokens];
        generatedTokens       = [];
        currentState          = example().start;
        generationComplete    = false;

        startButton.disabled  = true;
        resetButton.disabled  = false;
        setGenerateButton(true, 'generate');

        setPhase('running');
        setStep(0);
        renderContext(currentContextTokens, promptTokens.length);
        renderSkeletonRows('clickGenerate');
        renderIdleOutput();
    }

    function resetApplication() {
        promptTokens          = [];
        currentContextTokens  = [];
        generatedTokens       = [];
        currentState          = null;
        generationComplete    = false;

        startButton.disabled  = false;
        resetButton.disabled  = true;
        setGenerateButton(false, 'generate');

        setPhase('idle');
        setStep(0);
        renderIdleContext();
        renderSkeletonRows('clickStart');
        renderIdleOutput();

        fixedPromptDisplay.textContent = example().prompt;
    }

    // ─── Event listeners ──────────────────────────────────────────────────────
    startButton.addEventListener('click', initializeGeneration);
    resetButton.addEventListener('click', resetApplication);
    nextTokenButton.addEventListener('click', nextTokenStep);
    document.querySelectorAll('.lang-btn').forEach(btn =>
        btn.addEventListener('click', () => setLanguage(btn.dataset.lang)));

    window.onload = () => {
        lang = initialLanguage(T);
        resetApplication();
        applyLanguage();
        if (window.lucide) lucide.createIcons();
    };
</script>

</body>
</html>
